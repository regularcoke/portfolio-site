            function updateClock() {
  const clockEl = document.getElementById("user-clock");
  if (!clockEl) return;

  const now = new Date();

  // Format date & time
  const options = {
    weekday: "long",    
    year: "numeric",
    month: "short",      
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hour12: false        
  };

  clockEl.textContent = now.toLocaleString(undefined, options);
  clockEl.style.color = "black";
}

setInterval(updateClock, 1000);
updateClock(); 

window.addEventListener("DOMContentLoaded", () => {
  const slug = window.location.pathname.replace(/^\/+|\/+$/g, ""); // strip leading/trailing /

  if (slug) {
    // Find the matching project by generating slugs from all titles
    const projectKey = Object.keys(projects).find(key => {
      const project = projects[key];
      if (!project.title) return false;

      const projectSlug = project.title
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9\s-]/g, "")
        .trim()
        .replace(/\s+/g, "-");

      return projectSlug === slug;
    });

    if (projectKey) {
      loadProject(projectKey, document.querySelector(`.list a[href="/${slug}"]`));
    }
  }
  if (!slug || !projectKey) {
  const firstKey = Object.keys(projects)[0];
  const firstLink = document.querySelector(".list a");
  if (firstKey && firstLink) {
    loadProject(firstKey, firstLink);
  }
}
});
        </script>
