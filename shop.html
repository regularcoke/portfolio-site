<script>
/* same live clock as before */
function updateClock() {
  const clockEl = document.getElementById("user-clock");
  if (!clockEl) return;

  const now = new Date();

  const options = {
    weekday: "long",
    year: "numeric",
    month: "short",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hour12: false
  };

  clockEl.textContent = now.toLocaleString(undefined, options);
  clockEl.style.color = "black";
}

setInterval(updateClock, 1000);
updateClock();

</script>
