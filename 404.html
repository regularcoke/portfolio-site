<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    (function() {
      const path = window.location.pathname;   // e.g. /my-son-is-a-soldier
      const slug = path.split("/").filter(Boolean).pop();

      if (slug) {
        // Redirect to /work/ but keep slug in hash
        window.location.replace("/work/#/" + slug);
      } else {
        window.location.replace("/work/");
      }
    })();
  </script>
</head>
<body>
  <p style="font-family: Helvetica, sans-serif;"><a href="hugoadrianmarin.online/work">click here if you are not redirected</a></p>
</body>
</html>
