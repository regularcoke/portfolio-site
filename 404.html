<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    (function() {
      // Get the current path, e.g. /my-son-is-a-soldier
      const path = window.location.pathname;

      // Extract the last segment as slug
      const parts = path.split("/").filter(Boolean);
      const slug = parts.length ? parts[parts.length - 1] : null;

      if (slug) {
        // Always go to /work/#/slug
        window.location.replace("/work/#/" + slug);
      } else {
        // If no slug, just go to /work
        window.location.replace("/work/");
      }
    })();
  </script>
</head>
<body>
  <p style="font-family: Helvetica, sans-serif;"><a href="hugoadrianmarin.online/work">click here if you are not redirected</a></p>
</body>
</html>
