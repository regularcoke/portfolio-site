<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    // Grab the full path, e.g. "/my-son-is-a-soldier"
    const path = window.location.pathname;

    // Redirect to index.html but keep the path in a query parameter
    // This allows SPA to know the slug
    window.location.replace('/index.html' + path);
  </script>
</head>
<body>
  <p><a href="https://hugoadrianmarin.online/work">click here</a></p>
</body>
</html>
