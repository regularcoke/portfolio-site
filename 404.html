<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    (function() {
      // Get the full path after your domain, e.g. "/my-son-is-a-soldier"
      const path = window.location.pathname;

      // Extract just the slug (last segment)
      const slug = path.split("/").filter(Boolean).pop();

      if (slug) {
        // Redirect to /work with slug preserved
        window.location.replace("/work?slug=" + slug);
      } else {
        // Fallback to main work page
        window.location.replace("/work");
      }
    })();
  </script>
</head>
<body>
  <p style="font-family: Helvetica, sans-serif;"><a href="hugoadrianmarin.online/work">click here if you are not redirected</a></p>
</body>
</html>
